<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">GZCTF Viewing System 徽章</title>
  <desc id="desc">深空蓝徽章，中央的轨道之眼注视地球，下方是 GZCTF VIEWING SYSTEM 字样。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#234492"/>
      <stop offset=".48" stop-color="#142e68"/>
      <stop offset="1" stop-color="#08172f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#318ab5" stop-opacity=".42"/>
      <stop offset="1" stop-color="#318ab5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#86efff"/>
      <stop offset="1" stop-color="#4d83ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a4d7ff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect x="8" y="8" width="624" height="624" rx="128" fill="url(#surface)"/>
  <rect x="9" y="9" width="622" height="622" rx="127" fill="url(#grid)" stroke="#85bfff" stroke-opacity=".38" stroke-width="2"/>
  <circle cx="320" cy="273" r="252" fill="url(#glow)"/>
  <circle cx="320" cy="273" r="203" fill="none" stroke="#79b7f5" stroke-opacity=".28" stroke-width="2"/>
  <ellipse cx="320" cy="273" rx="239" ry="137" transform="rotate(-24 320 273)" fill="none" stroke="#65b5ff" stroke-opacity=".27" stroke-width="2"/>
  <path d="M111 273c58-86 128-128 209-128s151 42 209 128c-58 86-128 128-209 128S169 359 111 273Z" fill="#0d2655" stroke="#a4eaff" stroke-width="17" stroke-linejoin="round"/>
  <circle cx="320" cy="273" r="96" fill="url(#iris)"/>
  <circle cx="320" cy="273" r="76" fill="#124c9d"/>
  <path d="M244 273h152M320 197c-28 39-28 113 0 152m0-152c28 39 28 113 0 152" fill="none" stroke="#c3f8ff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="481" cy="121" r="15" fill="#5ce4d5"/>
  <circle cx="172" cy="423" r="8" fill="#8acfff"/>
  <path d="M174 475h292" stroke="#75b8ef" stroke-opacity=".55" stroke-width="2"/>
  <text x="320" y="551" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="63" font-weight="800" letter-spacing="2" text-anchor="middle">GZCTF</text>
  <text x="320" y="589" fill="#9fe8f4" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="5" text-anchor="middle">VIEWING SYSTEM</text>
